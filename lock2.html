<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翼龍化石保險箱</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at top,#2b6254,#0a1b22 75%);color:#f1fff5;font-family:system-ui,'Microsoft JhengHei',sans-serif}.panel{width:min(94vw,410px);border:2px solid #6b9d89;background:#12312f;border-radius:24px;padding:24px;text-align:center;box-shadow:0 18px 50px #0007}h1{font-size:25px;margin:0 0 8px}.hint{color:#b5d9c9;font-size:14px}.screen{margin:20px 0;background:#061e20;border:2px solid #61917d;border-radius:14px;padding:16px;letter-spacing:12px;font:36px monospace;min-height:78px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pad button{border:1px solid #74a997;border-radius:14px;background:#25594d;color:white;font-size:28px;font-weight:700;padding:15px;cursor:pointer}.pad button:active{background:#409c79}.pad .action{font-size:16px;background:#345b63}.success{display:none}.success .door{font-size:80px;margin:10px}.success h2{color:#a8f2bc}.place{font-size:25px;padding:18px;background:#2a5d4c;border-radius:15px;margin:18px 0}.reset{margin-top:15px;border:1px solid #83aa9b;color:white;background:transparent;border-radius:12px;padding:10px 18px;cursor:pointer}.error{color:#ff8e87;min-height:25px;margin-top:12px}.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}</style></head><body><main class="panel" id="panel"><section id="lock"><div style="font-size:38px">🦅🔒</div><h1>翼龍化石保險箱</h1><div class="hint">將化石透視板解出的密碼輸入控制台</div><div class="screen" id="display">_ _ _</div><div class="pad" id="pad"></div><div class="error" id="error"></div></section><section class="success" id="success"><div class="door">🔓</div><h2>保險箱解鎖成功！</h2><p>研究所發現下一個線索的位置！</p><div class="place">下一站：<strong>鋼琴房</strong> 🎹</div><p>請前往鋼琴房，尋找下一個線索！</p><button class="reset" onclick="reset()">重新開始</button></section></main><script>let code='',fails=0,locked=false;const display=document.querySelector('#display'),err=document.querySelector('#error'),pad=document.querySelector('#pad');function draw(){display.textContent=(code+'___').slice(0,3).split('').join(' ')}function press(v){if(locked)return;if(v==='C'){code='';err.textContent='';draw();return}if(v==='OK'){if(code.length!==3){err.textContent='請輸入三位數';return}if(code==='382'){document.querySelector('#lock').style.display='none';document.querySelector('#success').style.display='block'}else{fails++;code='';draw();err.textContent=fails>=3?'警報！請等 15 秒再試':'密碼錯誤！紅色警報 🚨';display.style.borderColor='#ff6b6b';document.querySelector('#panel').classList.add('shake');setTimeout(()=>document.querySelector('#panel').classList.remove('shake'),450);if(fails>=3){locked=true;setTimeout(()=>{locked=false;fails=0;err.textContent='系統恢復，可以重試';display.style.borderColor='#61917d'},15000)}}return}if(code.length<3){code+=v;draw()}}for(const v of ['1','2','3','4','5','6','7','8','9','C','0','OK']){let b=document.createElement('button');b.textContent=v==='C'?'清除':v==='OK'?'確認':v;if(v==='C'||v==='OK')b.className='action';b.onclick=()=>press(v);pad.appendChild(b)}function reset(){code='';fails=0;locked=false;err.textContent='';display.style.borderColor='#61917d';document.querySelector('#lock').style.display='block';document.querySelector('#success').style.display='none';draw()}draw();</script></body></html>
