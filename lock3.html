<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>恐龍研究所｜第三道電子鎖</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#f5ecd2;background:#142b28}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#345b43,#142b28 75%)}main{width:min(100%,430px);background:#263e33;border:3px solid #ad8850;border-radius:24px;padding:25px 22px;text-align:center;box-shadow:0 15px 45px #0006}h1{font-size:1.65rem;margin:8px 0}p{line-height:1.6;color:#d8d3b8}.icon{font-size:3rem}.display{background:#0c201b;border:2px solid #819b73;border-radius:12px;margin:20px 0;padding:12px;font-size:2rem;letter-spacing:.45em;min-height:66px;font-variant-numeric:tabular-nums}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}button{border:0;border-radius:13px;background:#e4c98c;color:#30291d;font-size:1.6rem;font-weight:750;min-height:68px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.96)}.secondary{background:#a3b8a2;font-size:1.1rem}.enter{background:#78cba0;font-size:1.1rem}.error{color:#ffb5a7;min-height:24px;margin-top:14px}#success{display:none}#success h2{font-size:2.1rem;color:#f4d78a}#success .place{font-size:4rem;margin:12px}#success .next{font-size:2.45rem;font-weight:800;color:#a9f0b9;letter-spacing:.08em}#success .sofa{width:100%;max-width:320px;height:auto;display:block;margin:12px auto;filter:drop-shadow(0 9px 5px #0003)}#success .hint{font-size:1.05rem;color:#f5dfaa}#reset{margin-top:22px;width:100%;font-size:1rem;min-height:48px}
</style>
</head>
<body><main>
<section id="lock"><div class="icon">🦖🔒</div><h1>恐龍研究所・第三道電子鎖</h1><p>博士留下的鏡像密碼，<br>只有看穿鏡中秘密才能解開！</p><div id="display" class="display" aria-live="polite">○ ○ ○</div><div class="keys" id="keys"></div><div id="error" class="error" aria-live="polite"></div></section>
<section id="success" aria-live="polite"><div class="icon">🦕✨</div><h2>解鎖成功！</h2><p>恐龍博士留下了下一關的暗號！<br>讀讀看，這是哪個地方？</p><div class="next" aria-label="ㄎㄜˋ ㄊㄧㄥ">ㄎㄜˋ　ㄊㄧㄥ</div><svg class="sofa" viewBox="0 0 360 240" role="img" aria-label="客廳裡一張大沙發"><rect x="8" y="8" width="344" height="224" rx="19" fill="#f6e8bf"/><rect x="35" y="28" width="290" height="165" rx="15" fill="#dfc99a"/><rect x="48" y="38" width="264" height="100" rx="19" fill="#87a78d" stroke="#3b6653" stroke-width="5"/><rect x="44" y="126" width="272" height="66" rx="16" fill="#a3c5a5" stroke="#3b6653" stroke-width="5"/><path d="M180 131v57" stroke="#61866c" stroke-width="4"/><rect x="23" y="107" width="48" height="92" rx="17" fill="#719a80" stroke="#3b6653" stroke-width="5"/><rect x="289" y="107" width="48" height="92" rx="17" fill="#719a80" stroke="#3b6653" stroke-width="5"/><rect x="54" y="195" width="20" height="19" rx="4" fill="#6a4d31"/><rect x="286" y="195" width="20" height="19" rx="4" fill="#6a4d31"/><path d="M100 70l37 9-8 39-39-8z" fill="#e6bc5b"/><path d="M230 79l38-9 11 39-39 9z" fill="#d88f68"/><path d="M86 216h189" stroke="#aa916b" stroke-width="4" stroke-linecap="round"/></svg><p class="hint">看看注音，再看看圖片。<br>下一關在哪裡呢？</p><button id="reset" class="secondary" type="button">重新挑戰</button></section>
</main>
<script>
(()=>{const ANSWER='547';let input='';const display=document.getElementById('display'),error=document.getElementById('error'),keys=document.getElementById('keys');function render(){display.textContent=(input+'○'.repeat(3-input.length)).split('').join(' ')}function press(v){error.textContent='';if(v==='clear'){input=''}else if(v==='back'){input=input.slice(0,-1)}else if(v==='enter'){if(input===ANSWER){document.getElementById('lock').style.display='none';document.getElementById('success').style.display='block'}else{error.textContent='密碼不正確，再觀察一次鏡子吧！';input=''}}else if(input.length<3){input+=v}render()}for(const v of ['1','2','3','4','5','6','7','8','9','清除','0','確認']){const b=document.createElement('button');b.type='button';b.textContent=v;if(v==='清除')b.className='secondary';if(v==='確認')b.className='enter';b.addEventListener('click',()=>press(v==='清除'?'clear':v==='確認'?'enter':v));keys.appendChild(b)}document.addEventListener('keydown',e=>{if(document.getElementById('success').style.display==='block')return;if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('back');else if(e.key==='Enter')press('enter');else if(e.key==='Escape')press('clear')});document.getElementById('reset').addEventListener('click',()=>{input='';error.textContent='';document.getElementById('lock').style.display='block';document.getElementById('success').style.display='none';render()});render()})();
</script></body></html>
