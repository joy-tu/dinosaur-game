<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>恐龍研究所｜電子密碼鎖</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at top,#244d49,#091b21 75%);color:#eafdf2;font-family:system-ui,'Microsoft JhengHei',sans-serif}.panel{width:min(94vw,390px);background:#102c30;border:2px solid #467d70;border-radius:25px;padding:25px;box-shadow:0 15px 50px #0008;text-align:center}h1{font-size:23px;margin:5px 0 8px}.subtitle{font-size:13px;color:#b6d9cd;margin-bottom:20px}.screen{border-radius:14px;border:2px solid #588c7d;background:#061c21;padding:18px 8px;margin-bottom:12px;font-size:32px;letter-spacing:10px;font-weight:700;min-height:81px}.status{height:36px;color:#b9d8c7;font-size:14px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.keys button{height:66px;border:1px solid #5c9c8c;border-radius:14px;background:#204a4c;color:white;font-size:25px;font-weight:700;cursor:pointer;touch-action:manipulation}.keys button:active{transform:scale(.96);background:#3d746a}.keys .special{font-size:16px;background:#34525c}.keys .ok{background:#2b8266}.success{display:none;padding:18px 0}.success h2{font-size:30px;color:#83edaa}.clue{background:#0c2228;border:1px solid #599d8a;padding:20px;border-radius:16px;font-size:23px;margin:18px 0}.reset,.settings-btn{border:1px solid #74b7a1;background:transparent;color:#c8f9e1;border-radius:10px;padding:11px 15px;cursor:pointer;margin-top:14px}.settings{margin-top:20px;border-top:1px solid #456d6c;padding-top:12px;text-align:left}.settings summary{cursor:pointer;color:#b2d2c7;font-size:13px;text-align:center}.settings label{display:block;margin:13px 0 5px;font-size:13px}.settings input{width:100%;font:inherit;border-radius:9px;border:1px solid #6b9b8f;background:#061c21;color:white;padding:10px}.settings .save{width:100%;margin-top:13px;background:#2b8266;border:0;color:white;padding:12px;border-radius:10px;font-weight:bold}.note{font-size:11px;color:#99b6ad;line-height:1.5;margin-top:15px}</style></head><body><main class="panel"><div style="font-size:40px">🦖🥚🔐</div><h1>恐龍研究所</h1><div class="subtitle">RESEARCH LAB · SECURITY SYSTEM</div><section id="locked"><div class="screen" id="display">_ _ _</div><div class="status" id="status">請輸入三位數密碼</div><div class="keys" id="keys"></div></section><section class="success" id="success"><div style="font-size:54px">🔓✨</div><h2>解鎖成功！</h2><p>你們破解了恐龍研究所的密碼！</p><div class="clue" id="clue">第二關：前往洗手台！</div><button class="reset" id="reset">重新上鎖</button></section><details class="settings"><summary>⚙️ 家長設定（請先設定好再交給孩子）</summary><label for="newcode">解鎖密碼（3–6 位數）</label><input id="newcode" inputmode="numeric" maxlength="6" value="426"><label for="newclue">解鎖後顯示的線索</label><input id="newclue" value="第二關：前往洗手台！"><button class="save" id="save">儲存設定並上鎖</button></details><div class="note">離線可用 · 不需帳號 · 設定僅保留在本次開啟的網頁中</div></main><script>let code='426',clue='第二關：前往洗手台！',entered='';const display=document.querySelector('#display'),status=document.querySelector('#status'),keys=document.querySelector('#keys');function render(){display.textContent=Array.from({length:code.length},(_,i)=>entered[i]||'_').join(' ')}function press(k){if(k==='清除'){entered='';status.textContent='請輸入密碼'}else if(k==='⌫'){entered=entered.slice(0,-1)}else if(k==='確認'){if(entered===code){document.querySelector('#locked').style.display='none';document.querySelector('#success').style.display='block';document.querySelector('#clue').textContent=clue;status.textContent=''}else{entered='';status.textContent='❌ 密碼錯誤，再試一次！'}}else if(entered.length<code.length){entered+=k;status.textContent='請輸入密碼'}render()}for(const k of ['1','2','3','4','5','6','7','8','9','清除','0','確認']){const b=document.createElement('button');b.textContent=k;if(k==='清除')b.className='special';if(k==='確認')b.className='ok';b.addEventListener('click',()=>press(k));keys.append(b)}document.querySelector('#reset').onclick=()=>{entered='';document.querySelector('#locked').style.display='block';document.querySelector('#success').style.display='none';status.textContent='請輸入密碼';render()};document.querySelector('#save').onclick=()=>{const c=document.querySelector('#newcode').value.trim();if(!/^\d{3,6}$/.test(c)){alert('請設定 3–6 位數字密碼');return}code=c;clue=document.querySelector('#newclue').value.trim()||'恭喜解鎖！';document.querySelector('#reset').click();document.querySelector('.settings').open=false};document.addEventListener('keydown',e=>{if(document.activeElement.tagName==='INPUT')return;if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');else if(e.key==='Enter')press('確認')});render();</script></body></html>
