<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>恐龍研究所｜電子密碼鎖</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at top,#244d49,#091b21 75%);color:#eafdf2;font-family:system-ui,'Microsoft JhengHei',sans-serif}.panel{width:min(94vw,390px);background:#102c30;border:2px solid #467d70;border-radius:25px;padding:25px;box-shadow:0 15px 50px #0008;text-align:center}h1{font-size:23px;margin:5px 0 8px}.subtitle{font-size:13px;color:#b6d9cd;margin-bottom:20px}.screen{border-radius:14px;border:2px solid #588c7d;background:#061c21;padding:18px 8px;margin-bottom:12px;font-size:32px;letter-spacing:10px;font-weight:700;min-height:81px}.status{height:36px;color:#b9d8c7;font-size:14px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.keys button{height:66px;border:1px solid #5c9c8c;border-radius:14px;background:#204a4c;color:white;font-size:25px;font-weight:700;cursor:pointer;touch-action:manipulation}.keys button:active{transform:scale(.96);background:#3d746a}.keys .special{font-size:16px;background:#34525c}.keys .ok{background:#2b8266}.success{display:none;padding:18px 0}.success h2{font-size:30px;color:#83edaa}.clue{background:#0c2228;border:1px solid #599d8a;padding:20px;border-radius:16px;font-size:23px;margin:18px 0}.mission{border:1px dashed #6fa999;border-radius:14px;padding:14px;text-align:left;line-height:1.65;background:#123438}.mission-title{font-weight:800;color:#a8f4c4;text-align:center}.mission p{margin:9px 0}.mission-end{font-weight:700;color:#f6e2a2;margin-top:14px}.key-tip{margin-top:12px;font-size:14px;color:#c8e4ff}.reset,.settings-btn{border:1px solid #74b7a1;background:transparent;color:#c8f9e1;border-radius:10px;padding:11px 15px;cursor:pointer;margin-top:14px}.settings{margin-top:20px;border-top:1px solid #456d6c;padding-top:12px;text-align:left}.settings summary{cursor:pointer;color:#b2d2c7;font-size:13px;text-align:center}.settings label{display:block;margin:13px 0 5px;font-size:13px}.settings input{width:100%;font:inherit;border-radius:9px;border:1px solid #6b9b8f;background:#061c21;color:white;padding:10px}.settings .save{width:100%;margin-top:13px;background:#2b8266;border:0;color:white;padding:12px;border-radius:10px;font-weight:bold}.note{font-size:11px;color:#99b6ad;line-height:1.5;margin-top:15px}.visual-location{background:#163f43;border:2px solid #6cb2a5;border-radius:18px;padding:12px;margin:12px 0}.visual-location svg{display:block;width:100%;max-height:150px}.visual-location strong{font-size:25px;color:#fff2ae}.picture-clues{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.picture-clues .pic{background:#eaf7e8;color:#163b38;border-radius:13px;padding:8px 4px;min-width:0}.picture-clues svg{width:100%;height:96px;display:block}.picture-clues b{font-size:16px}.picture-clues small{display:block;font-size:12px}.mission{text-align:center}.mission-end{font-size:20px}.key-tip{font-size:16px}.success h2{margin-bottom:6px}.clue{font-size:19px;padding:12px;margin:12px 0}@media(max-width:360px){.panel{padding:14px}.picture-clues svg{height:76px}.picture-clues b{font-size:14px}}</style></head><body><main class="panel"><div style="font-size:40px">🦖🥚🔐</div><h1>恐龍研究所</h1><div class="subtitle">RESEARCH LAB · SECURITY SYSTEM</div><section id="locked"><div class="screen" id="display">_ _ _</div><div class="status" id="status">請輸入三位數密碼</div><div class="keys" id="keys"></div></section><section class="success" id="success"><div style="font-size:54px">🔓✨</div><h2>解鎖成功！</h2><p>你們破解了恐龍研究所的密碼！</p><div class="clue" id="clue">第二號任務：前往房間，找出正確的恐龍影子！</div><div class="mission" id="mission"><div class="mission-title">🧭 先去哪裡？</div><div class="visual-location"><svg viewBox="0 0 320 145" role="img" aria-label="臥室：床、枕頭、窗戶"><rect x="22" y="12" width="84" height="78" rx="8" fill="#a7d9f5" stroke="#e4f6ff" stroke-width="5"/><path d="M64 12V90 M22 50H106" stroke="#e4f6ff" stroke-width="5"/><circle cx="276" cy="35" r="18" fill="#ffe7a2"/><rect x="30" y="92" width="260" height="32" rx="9" fill="#f5b869"/><rect x="30" y="71" width="260" height="28" rx="9" fill="#75b5cf"/><rect x="38" y="65" width="73" height="29" rx="13" fill="#fff5d7"/><path d="M34 122V138 M285 122V138" stroke="#c58c59" stroke-width="11" stroke-linecap="round"/></svg><strong>🛏️ 臥室／房間</strong></div><div class="mission-title">🔍 找出有這三個特徵的恐龍影子</div><div class="picture-clues"><div class="pic"><svg viewBox="0 0 100 100" role="img" aria-label="三隻角"><path d="M17 79L30 23L42 79Z M40 79L51 11L63 79Z M64 79L78 27L88 79Z" fill="#e9b45b" stroke="#946329" stroke-width="3" stroke-linejoin="round"/><path d="M12 82Q50 67 91 82" fill="none" stroke="#608b70" stroke-width="9" stroke-linecap="round"/></svg><b>3 隻角</b><small>▲ ▲ ▲</small></div><div class="pic"><svg viewBox="0 0 100 100" role="img" aria-label="頭後方大骨盾"><path d="M22 73Q6 50 25 20L39 27L52 9L65 27L80 20Q96 50 77 73Q51 92 22 73Z" fill="#9ad5bd" stroke="#3c806a" stroke-width="4"/><ellipse cx="51" cy="61" rx="20" ry="17" fill="#c7ebdb" stroke="#3c806a" stroke-width="3"/></svg><b>大骨盾</b><small>頭後面</small></div><div class="pic"><svg viewBox="0 0 100 100" role="img" aria-label="四隻腳"><rect x="18" y="25" width="65" height="34" rx="16" fill="#87b7e7" stroke="#3f77a9" stroke-width="3"/><path d="M24 55V85H37V55 M43 55V85H56V55 M62 55V85H75V55 M78 55V85H91V55" fill="#87b7e7" stroke="#3f77a9" stroke-width="3" stroke-linejoin="round"/></svg><b>4 隻腳</b><small>🦶🦶🦶🦶</small></div></div><div class="mission-end">找到影子卡 → 選出正確恐龍 → 翻到背面！</div><div class="key-tip">⭐ 先向家長領取第一把星星鑰匙</div></div></div><button class="reset" id="reset">重新上鎖</button></section><details class="settings"><summary>⚙️ 家長設定（請先設定好再交給孩子）</summary><label for="newcode">解鎖密碼（3–6 位數）</label><input id="newcode" inputmode="numeric" maxlength="6" value="426"><label for="newclue">解鎖後顯示的任務標題</label><input id="newclue" value="第二號任務：前往房間，找出正確的恐龍影子！"><button class="save" id="save">儲存設定並上鎖</button></details><div class="note">離線可用 · 不需帳號 · 家長可修改密碼及任務標題，三張恐龍特徵圖片固定顯示</div></main><script>let code='426',clue='第二號任務：前往房間，找出正確的恐龍影子！',entered='';const display=document.querySelector('#display'),status=document.querySelector('#status'),keys=document.querySelector('#keys');function render(){display.textContent=Array.from({length:code.length},(_,i)=>entered[i]||'_').join(' ')}function press(k){if(k==='清除'){entered='';status.textContent='請輸入密碼'}else if(k==='⌫'){entered=entered.slice(0,-1)}else if(k==='確認'){if(entered===code){document.querySelector('#locked').style.display='none';document.querySelector('#success').style.display='block';document.querySelector('#clue').textContent=clue;status.textContent=''}else{entered='';status.textContent='❌ 密碼錯誤，再試一次！'}}else if(entered.length<code.length){entered+=k;status.textContent='請輸入密碼'}render()}for(const k of ['1','2','3','4','5','6','7','8','9','清除','0','確認']){const b=document.createElement('button');b.textContent=k;if(k==='清除')b.className='special';if(k==='確認')b.className='ok';b.addEventListener('click',()=>press(k));keys.append(b)}document.querySelector('#reset').onclick=()=>{entered='';document.querySelector('#locked').style.display='block';document.querySelector('#success').style.display='none';status.textContent='請輸入密碼';render()};document.querySelector('#save').onclick=()=>{const c=document.querySelector('#newcode').value.trim();if(!/^\d{3,6}$/.test(c)){alert('請設定 3–6 位數字密碼');return}code=c;clue=document.querySelector('#newclue').value.trim()||'恭喜解鎖！';document.querySelector('#reset').click();document.querySelector('.settings').open=false};document.addEventListener('keydown',e=>{if(document.activeElement.tagName==='INPUT')return;if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');else if(e.key==='Enter')press('確認')});render();</script></body></html>
